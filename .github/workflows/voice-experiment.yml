# Free-voice experiment on a Linux machine: Kokoro (Apache 2.0) for English, and Urdu through its Hindi voices.
# Run it from the Actions tab (Run workflow) or by pushing to the branch `voice-experiment`. The WAV files and a results table are attached to the run as "voice-samples".
name: voice-experiment

on:
  push:
    branches: [voice-experiment]
  workflow_dispatch:

permissions:
  contents: write   # to save the results on the branch `voice-results`

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install kokoro-onnx soundfile faster-whisper
      - name: Model files (Kokoro 8-bit and its voices)
        run: |
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          curl -sL -o voices-v1.0.bin $B/voices-v1.0.bin
          ls -la kokoro-v1.0.int8.onnx voices-v1.0.bin
      - name: Make the voices and have Whisper listen to them
        run: python backend/tools/voice_experiment.py
      - run: cat out/results.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-samples
          path: out/
      - name: Save the results on the branch voice-results (so they can be fetched with plain git)
        if: always()
        run: |
          git config user.name "voice-experiment"
          git config user.email "voice-experiment@users.noreply.github.com"
          git checkout --orphan voice-results
          git rm -rf . > /dev/null 2>&1 || true
          cp -r out/. .
          git add -A
          git commit -m "voice experiment results" > /dev/null
          git push -f origin voice-results
