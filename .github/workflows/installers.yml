# Builds the installers other people download: a .dmg for macOS (Intel and Apple chips) and a setup .exe for Windows.
# Run it by pushing to the branch `build-installers` (git push origin main:build-installers), by tagging v*, or from the Actions tab (Run workflow).
# The finished files are attached to the run as artifacts ("Artifacts" at the bottom of the run page).
name: installers

on:
  push:
    branches: [build-installers]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS (Apple chip)", os: macos-latest, bundles: dmg }
          - { name: "macOS (Intel)", os: macos-15-intel, bundles: dmg }
          - { name: "Windows", os: windows-latest, bundles: nsis }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Get ffmpeg (static build with caption support)
        run: |
          python -m pip install -e backend
          avc fetch-ffmpeg
        env:
          PYTHONUTF8: "1"
      - name: Build the bundled Python runtime
        run: python desktop/build_runtime.py
        env:
          PYTHONUTF8: "1"
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
