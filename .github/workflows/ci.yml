# Runs the tests on macOS, Windows and Linux. This is how Windows gets checked without a Windows computer on the desk:
# push to GitHub and read the three columns. (Written without being able to run it: if a job fails, the log says why.)
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full   # plain `ffmpeg` has no libass (caption burn-in); ffmpeg-full is keg-only, so put it first on PATH
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest backend/tests -q -rfE --tb=short
        env:
          PYTHONUTF8: "1"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  desktop:
    name: desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build libraries for the webview
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test
        working-directory: desktop/src-tauri
