<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Creator</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7f9; color: #1b1f24; }
  @media (prefers-color-scheme: dark) { body { background: #14171c; color: #e8eaed; } }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  .spin { width: 2.5rem; height: 2.5rem; margin: 0 auto 1rem; border: 4px solid #8884; border-top-color: #2f5fe3; border-radius: 50%; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .err { color: #c0392b; white-space: pre-wrap; text-align: left; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; background: #8881; padding: .75rem; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin" role="progressbar" aria-label="Starting"></div>
  <h1 style="font-size:1.25rem" id="title">Starting AI Video Creator…</h1>
  <p id="msg">Starting the local server. The first start can take a few seconds.</p>
</main>
<script>
  // called by the desktop shell when the server could not be started
  window.showStartError = function (text) {
    document.getElementById("spin").hidden = true;
    document.getElementById("title").textContent = "AI Video Creator could not start";
    var p = document.getElementById("msg");
    p.className = "err";
    p.textContent = text;
  };
</script>
</body>
</html>
